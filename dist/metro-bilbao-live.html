<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metro Bilbao Live</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Metro Bilbao Live — palette drawn from Foster's stations: grey granite, steel, the orange of the line */
:root{
  --sea:#C5D1D5; --land-out:#DCDEDA; --land:#F2F2EE; --water:#BCCBD1; --muni:#D6D8D1; --coast:#9FAAAD;
  --river:#A3BBC4; --road:#E2C8A4; --road2:#E9DAC4; --place:#7C8588;
  --paper:#FBFBF9; --paper-a:rgba(251,251,249,.94); --ink:#1D2326; --muted:#5E676B; --faint:#8C9598; --rule:#DADDD8; --hover:#EEF0ED;
  --l1:#F2641E; --l1-ink:#fff; --l2:#1D2326; --l2-ink:#fff; --track-neutral:#9AA3A6;
  --stn-fill:#fff; --stn-ring:#1D2326; --steel:#F7F8F7; --steel-line:#B7BEC1;
  --ok:#23845A; --warn:#C27A0E; --bad:#C23A2E; --early:#2D6FB8;
  --shadow:0 1px 0 rgba(29,35,38,.06),0 10px 30px -14px rgba(29,35,38,.35);
  --radius:14px;
  --sans:'Archivo',"Helvetica Neue",Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0F1417; --land-out:#171C1F; --land:#20262A; --water:#101619; --muni:#2B3236; --coast:#3A4549;
  --river:#284651; --road:#5A4A33; --road2:#3E372C; --place:#8D979B;
  --paper:#1A1F22; --paper-a:rgba(26,31,34,.94); --ink:#E7E9E6; --muted:#A0A9AD; --faint:#6F7A7E; --rule:#2E3539; --hover:#242A2E;
  --l1:#FF7536; --l1-ink:#1A1F22; --l2:#E3E6E3; --l2-ink:#1A1F22; --track-neutral:#5C676B;
  --stn-fill:#1A1F22; --stn-ring:#E7E9E6; --steel:#C9CFD1; --steel-line:#8C969A;
  --ok:#4CC08A; --warn:#F0A63A; --bad:#FF6F61; --early:#6FA8EC;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 34px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sea:#0F1417; --land-out:#171C1F; --land:#20262A; --water:#101619; --muni:#2B3236; --coast:#3A4549;
  --river:#284651; --road:#5A4A33; --road2:#3E372C; --place:#8D979B;
  --paper:#1A1F22; --paper-a:rgba(26,31,34,.94); --ink:#E7E9E6; --muted:#A0A9AD; --faint:#6F7A7E; --rule:#2E3539; --hover:#242A2E;
  --l1:#FF7536; --l1-ink:#1A1F22; --l2:#E3E6E3; --l2-ink:#1A1F22; --track-neutral:#5C676B;
  --stn-fill:#1A1F22; --stn-ring:#E7E9E6; --steel:#C9CFD1; --steel-line:#8C969A;
  --ok:#4CC08A; --warn:#F0A63A; --bad:#FF6F61; --early:#6FA8EC;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 34px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:fixed;inset:0}

/* ---------- map ---------- */
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.bm-land-out{fill:var(--land-out)}
.bm-sea{fill:var(--sea)}
.bm-land{fill:var(--land)}
.bm-water{fill:var(--water)}
.bm-muni{fill:none;stroke:var(--muni);stroke-width:1;vector-effect:non-scaling-stroke}
.bm-coast{fill:none;stroke:var(--coast);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.bm-river{fill:none;stroke:var(--river);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.bm-road{fill:none;stroke:var(--road);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.bm-road2{fill:none;stroke:var(--road2);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.bm-border{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.3;stroke-dasharray:6 3 1.5 3;vector-effect:non-scaling-stroke}
#app.tiles-on .bm-land{fill:transparent}
#app.tiles-on #bm-over .bm-muni,#app.tiles-on #bm-over .bm-road,#app.tiles-on #bm-over .bm-road2,#app.tiles-on #bm-over .bm-river,#app.tiles-on #bm-over .bm-water{display:none}
#tiles image{image-rendering:auto}

.track{fill:none;stroke-linecap:round;stroke-linejoin:round}
.track.casing{stroke:var(--land)}
#app.tiles-on .track.casing{stroke:var(--paper)}
.track.l1{stroke:var(--l1)} .track.l2{stroke:var(--l2)} .track.l0{stroke:var(--track-neutral)}
.track.dim{opacity:.18}

.stn{cursor:pointer}
.stn .mk{fill:var(--stn-fill);stroke:var(--stn-ring);stroke-width:2}
.stn.term .mk{stroke-width:2.6}
.stn .hit{fill:transparent}
.stn:hover .mk,.stn:focus-visible .mk{fill:var(--l1)}
.stn.sel .mk{fill:var(--ink);stroke:var(--ink)}
.stn:focus{outline:none}
.stn:focus-visible .hit{stroke:var(--l1);stroke-width:2;stroke-dasharray:3 2}
.stn.alert .mk{stroke:var(--warn)}
.lbl{font-size:12px;font-weight:560;font-stretch:88%;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:3.4px;stroke-linejoin:round;pointer-events:none}
#app.tiles-on .lbl{stroke:var(--paper)}
.lbl.big{font-size:13px;font-weight:700;fill:var(--ink)}
.lbl.sel{font-weight:800;fill:var(--ink)}
.place{font-size:10.5px;font-weight:600;font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;fill:var(--place);opacity:.75;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.place.sea{fill:var(--coast);stroke:none;font-style:italic;letter-spacing:.3em;text-transform:none;font-weight:500;opacity:.9}

/* trains */
.train{cursor:pointer}
.train .hit{fill:transparent}
.train .halo{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.train.sel .halo{opacity:1}
.train .shadow{fill:#000;opacity:.22}
.train .body{fill:var(--steel);stroke-width:1.8;stroke-linejoin:round}
.train.l1 .body{stroke:var(--l1)} .train.l2 .body{stroke:var(--l2)}
.train .roof{fill:#5B666C;opacity:.55}
.train .panto{fill:none;stroke:#46525A;stroke-width:.9;stroke-linecap:round}
.train .glass{fill:#1B2226}
.train .head{fill:#FFE9A8}
.train .tail{fill:#E0443A}
.train.sched .body{stroke-dasharray:4 2.5}
.train.enter{animation:enter .6s ease-out}
@keyframes enter{from{opacity:0}to{opacity:1}}
.trail{fill:none;stroke-linecap:round;opacity:.35}
.trail.l1{stroke:var(--l1)} .trail.l2{stroke:var(--l2)}
.train.hidden,.stn.hidden{display:none}

/* ---------- floating card ---------- */
#card{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;width:318px;max-width:calc(100% - 32px);background:var(--paper-a);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.brand .sub{margin:0;border-left:1px solid var(--rule);padding-left:12px;line-height:1.25;max-width:9em}
.brand-logo{height:34px;width:auto;flex:none;display:block}
.logo .lg-bg{fill:var(--l1)} .logo .lg-body{fill:#fff} .logo .lg-glass{fill:#1D2326} .logo .lg-lamp{fill:var(--l1)} .logo .lg-rail{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round}
h1{margin:0;font-size:17px;font-weight:760;font-stretch:92%;letter-spacing:-.005em;line-height:1.1}
.sub{margin:1px 0 0;color:var(--muted);font-size:12px;font-stretch:95%}
.brand .icon-btn{margin-left:auto}
.icon-btn{width:32px;height:32px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#card.collapsed .collapsible{display:none}
#card.collapsed #collapse svg{transform:rotate(180deg)}
.collapsible{display:flex;flex-direction:column;gap:12px}
.clockrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
#clock{font-family:var(--sans);font-size:46px;font-weight:780;font-stretch:70%;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#clock span{font-size:.5em;color:var(--muted);font-weight:500;margin-left:2px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 10px 5px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.pill[data-state="live"] i{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2s infinite}
.pill[data-state="stale"] i{background:var(--warn)}
.pill[data-state="offline"] i{background:var(--faint)}
.pill[data-state="error"] i{background:var(--bad)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}80%,100%{box-shadow:0 0 0 7px transparent}}
.lines{display:flex;flex-direction:column;gap:6px}
.linechip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;border:1px solid var(--rule);background:transparent;border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left}
.linechip:hover{background:var(--hover)}
.linechip span{font-size:13px;font-weight:560;font-stretch:92%}
.linechip em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted)}
.linechip[aria-pressed="false"]{opacity:.45}
.linechip[aria-pressed="false"] .badge{filter:grayscale(1)}
.badge{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:800;font-stretch:90%;letter-spacing:.02em;font-style:normal}
.badge.l1{background:var(--l1);color:var(--l1-ink)} .badge.l2{background:var(--l2);color:var(--l2-ink)}
.badge.sm{min-width:24px;height:18px;font-size:10.5px;border-radius:5px;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats div{background:var(--hover);border-radius:9px;padding:7px 9px}
.stats dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats dd{margin:2px 0 0;font-size:18px;font-weight:760;font-stretch:85%;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:100%;height:36px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:0 12px;font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--l1);outline-offset:-1px}
#results{position:absolute;left:0;right:0;top:40px;margin:0;padding:4px;list-style:none;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:3}
#results li{padding:7px 9px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:8px}
#results li[aria-selected="true"],#results li:hover{background:var(--hover)}
.langs{display:flex;gap:4px;justify-content:flex-end;margin-top:-4px}
.langs button{border:1px solid var(--rule);background:transparent;border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);cursor:pointer}
.langs button:hover{background:var(--hover);color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cardfoot{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.textbtn{border:0;background:transparent;padding:4px 2px;font-size:13px;font-weight:650;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.textbtn:hover{text-decoration-color:currentColor}
#alerts-btn{color:var(--warn)}

/* ---------- side panel ---------- */
#panel{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:370px;max-width:calc(100% - 32px);background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:6}
.ph{padding:14px 18px 12px;border-bottom:1px solid var(--rule);position:relative;flex:none}
.kicker{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;min-height:18px}
.ph h2{margin:4px 0 0;font-size:25px;font-weight:780;font-stretch:80%;line-height:1.05;padding-right:34px;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ph .icon-btn{position:absolute;top:10px;right:10px}
#pc{overflow:auto;flex:1;overscroll-behavior:contain}
.sect{padding:10px 18px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;display:flex;justify-content:space-between;gap:8px}
.board{list-style:none;margin:0;padding:0 8px 8px}
.board li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer}
.board li:hover{background:var(--hover)}
.board .dest{font-weight:650;font-size:14.5px;line-height:1.2}
.board .meta{display:block;font-size:12px;color:var(--muted);font-weight:450;margin-top:1px}
.board .when{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.board .when b{display:block;font-size:15px;font-weight:600;font-family:var(--sans);font-stretch:85%}
.board .when small{font-size:11.5px;color:var(--muted)}
.board .when s{color:var(--faint)}
.board li.gone{opacity:.45}
.board li.cancel .dest{text-decoration:line-through}
.dchip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.dchip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.dchip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.dchip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.dchip.early{color:var(--early);background:color-mix(in srgb,var(--early) 14%,transparent)}
.dchip.sched{color:var(--muted);background:var(--hover)}
.empty{padding:22px 18px;color:var(--muted);line-height:1.5}
.note{padding:6px 18px 16px;color:var(--muted);font-size:12px;line-height:1.45}

/* train illustration (side + front view of a CAF 500/550/600-series unit, drawn from photos) */
.unit{position:relative;padding:14px 12px 4px;border-bottom:1px solid var(--rule);background:linear-gradient(var(--hover),var(--paper) 85%);overflow:hidden}
.unit svg{display:block;overflow:visible}
.unit > svg{width:100%;height:auto}
.u-a0{stop-color:#F4F6F6} .u-a1{stop-color:#DDE2E4} .u-a2{stop-color:#C4CBCE} .u-a3{stop-color:#A4ADB1}
.unit .u-body{stroke:#8A9498;stroke-width:.7}
.unit .u-grille{fill:#59636A} .unit .u-grill{stroke:#2E363B;stroke-width:.9}
.unit .u-panto rect{fill:#4E585E}
.unit .u-panto path{fill:none;stroke:#30393F;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.unit .u-wire{stroke:var(--faint);stroke-width:.9}
.unit .u-band{stroke:#0A0D0F;stroke-width:.5}
.unit .u-gang{fill:#262D31}
.unit .u-under{fill:#2F383D} .unit .u-box{fill:#3F4A50}
.unit .u-bogie{fill:#262D31}
.unit .u-wheel{fill:#171C1F;stroke:#78838A;stroke-width:1.1}
.unit .u-spoke{stroke:#78838A;stroke-width:1;fill:none}
.unit .u-hub{fill:#A5AEB2}
.unit .u-rail{stroke:var(--faint);stroke-width:2}
.unit .u-sleeper{fill:var(--rule)}
.unit .u-leaf{fill:#CDD3D5;stroke:#8A9498;stroke-width:.5}
.unit .u-dglass{fill:#151A1D}
.unit .u-inside{opacity:0;transition:opacity .4s}
.unit .u-pole{stroke:#B8A57E;stroke-width:1;opacity:0;transition:opacity .4s}
.unit .u-jamb{stroke:#E4502A;stroke-width:1.1}
.unit .u-door{transition:transform 1s cubic-bezier(.45,0,.25,1)}
.unit .u-stripe{fill:#E4502A}
.unit .u-sled{fill:#0A0C0D;stroke:#39434A;stroke-width:.3}
.unit .u-cabwin{fill:#12171A}
.unit .u-sideface{fill:#101417}
.unit .u-light{fill:#FFF6D6} .unit .u-glow{opacity:0;transition:opacity .5s}
.unit .u-tail{fill:#E0443A}
.unit .u-num{font-family:var(--mono);font-size:5px;font-weight:600;fill:#39434A}
.unit .u-wheelg{transform-box:fill-box;transform-origin:center}
.unit.moving .u-wheelg{animation:spin .55s linear infinite}
.unit.moving .u-track{animation:slide .36s linear infinite}
.unit.moving .u-bodyg{animation:bob 1.3s ease-in-out infinite}
.unit.moving .u-glow{opacity:1}
.unit.moving .u-sled{fill:#3A1A08}
.unit.open .u-door.l{transform:translateX(-6.6px)} .unit.open .u-door.r{transform:translateX(6.6px)}
.unit.open .u-inside,.unit.open .u-pole{opacity:1}
/* front view */
.f-shell{stroke:#8A9498;stroke-width:.7}
.f-grille{fill:#59636A}
.f-led{fill:#050607}
.f-ledtext{font-family:var(--mono);font-size:3.2px;font-weight:600;fill:#FF8A2A}
.f-reflect{fill:#fff;opacity:.07}
.f-wiper{stroke:#050607;stroke-width:1;stroke-linecap:round}
.f-head{fill:#FFF6D6}
.f-tail{fill:#E0443A;opacity:.35}
.f-bumper{fill:#15191C}
.f-line.l1{fill:var(--l1)} .f-line.l2{fill:#E7E9E6}
.f-num{font-family:var(--mono);font-size:3.4px;font-weight:600;fill:#39434A}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{transform:translateX(-11px)}}
@keyframes bob{50%{transform:translateY(.45px)}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 18px}
.ph.has-front{padding-left:78px;min-height:86px}
.ph-front{position:absolute;left:16px;top:12px;width:50px}
.ph-front svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.facts div{min-width:0}
.facts dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* train timeline */
.tl{list-style:none;margin:0;padding:6px 18px 16px;position:relative}
.tl li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:38px;position:relative;cursor:pointer}
.tl li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:var(--lc,var(--l1));opacity:.9}
.tl li:first-child::before{top:50%} .tl li:last-child::before{bottom:50%}
.tl li.past::before{opacity:.25}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--lc,var(--l1));justify-self:center;z-index:1}
.tl li.past .dot{border-color:var(--rule)}
.tl li.now .dot{background:var(--lc,var(--l1))}
.tl .n{font-weight:600;font-size:14px}
.tl li.past .n{color:var(--muted);font-weight:450}
.tl .t{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tl .t s{color:var(--faint);font-size:11.5px;margin-right:4px}
.tl li.past .t{color:var(--faint)}
.tl .me{position:absolute;left:4px;width:15px;height:15px;border-radius:4px;background:var(--lc,var(--l1));border:2px solid var(--paper);z-index:2;transition:top .5s linear;box-shadow:0 0 0 3px color-mix(in srgb,var(--lc,var(--l1)) 30%,transparent)}
.tl li.skip .n{text-decoration:line-through;color:var(--muted)}

/* alerts */
.alert{padding:12px 18px;border-bottom:1px solid var(--rule)}
.alert h3{margin:0 0 4px;font-size:14.5px}
.alert p{margin:0;color:var(--muted);line-height:1.45;font-size:13px;white-space:pre-line}
.alert .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}

/* map controls */
#controls{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;flex-direction:column;gap:6px;z-index:4}
.ctl{width:40px;height:40px;border-radius:10px;border:0;background:var(--paper-a);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.ctl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ctl:hover{background:var(--paper)}
.ctl[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#app.panel-open #controls{right:402px}
#attrib{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-size:10.5px;color:var(--muted);background:var(--paper-a);padding:2px 7px;border-radius:6px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
#attrib a{color:inherit}
#app.panel-open #attrib{right:394px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 36px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:13px;z-index:9;max-width:calc(100% - 32px)}

button:focus-visible,.linechip:focus-visible,a:focus-visible{outline:2px solid var(--l1);outline-offset:2px}

@media (max-width:760px){
  #card{width:auto;right:16px;padding:10px 12px;gap:10px}
  .collapsible{gap:10px}
  #clock{font-size:36px}
  .stats dd{font-size:16px}
  .linechip span{font-size:12.5px}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:58%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--rule)}
  #app.panel-open #controls,#app.panel-open #attrib{display:none}
  #controls{bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  #zi,#zo{display:none}
  .lines{flex-direction:row}
  .linechip{grid-template-columns:auto auto;justify-content:start;gap:8px}
  .linechip span{display:none}
  .stats div{padding:5px 8px}
  #app.panel-open #card .collapsible{display:none}
  #app.panel-open #card #collapse{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* keep the train drawing in view while the calling points scroll */
#pc .unit{position:sticky;top:0;z-index:3}

  const e = trainEls.get(selected.key); const tl = $('pc').querySelector('.tl'); if (!e || !tl) return;
  const items = tl.children; const { pos } = e;
  const a = items[pos.k]; const b = items[pos.dwell ? pos.k : pos.next];
  if (!a || !b) return;
  let me = tl.querySelector('.me'); if (!me) { me = document.createElement('span'); me.className = 'me'; tl.appendChild(me); }
  const ya = a.offsetTop + a.offsetHeight / 2, yb = b.offsetTop + b.offsetHeight / 2;
  me.style.top = (ya + (yb - ya) * (pos.dwell ? 0 : pos.f) - 7.5) + 'px';
  [...items].forEach((li, k) => { if (li.tagName === 'LI') li.classList.toggle('past', k < (pos.dwell ? pos.k : pos.next) && !(pos.dwell && k === pos.k)); });
}
$('pc').addEventListener('click', ev => {
  const li = ev.target.closest('li'); if (!li) return;
  if (li.dataset.key) {
    select({ type: 'train', key: li.dataset.key });
    const e = trainEls.get(li.dataset.key);
    if (e) flyTo({ s: Math.max(view.s, 0.12), cx: e.pos.x + (W > 760 ? 180 / Math.max(view.s, .12) : 0), cy: e.pos.y + (W <= 760 ? H * .22 / Math.max(view.s, .12) : 0) }, 700);
  } else if (li.dataset.stn) select({ type: 'stn', id: +li.dataset.stn }, { fly: true });
});
$('close').onclick = () => select(null);

/* ---------- card ---------- */
function renderStatus() {
  const p = $('status');
  const txt = t('status.' + RT.state);
  p.dataset.state = RT.state;
  p.querySelector('span').textContent = txt;
  p.title = RT.state === 'live' ? t('status.title') : RT.error || '';
}
function renderAlertsButton() {
  const n = RT.alerts.length; $('alerts-btn').hidden = !n; $('alerts-btn').textContent = tn('foot.alerts', n);
  const ids = new Set(); RT.alerts.forEach(a => a.stops.forEach(s => { const v = D.stopMap[s]; if (v !== undefined) ids.add(v); }));
  stnEls.forEach((e, i) => e.g.classList.toggle('alert', ids.has(i)));
}
function renderStats(counts) {
  $('c1').textContent = tn('count.trains', counts[1]); $('c2').textContent = tn('count.trains', counts[2]);
  const tNow = performance.now();
  const ds = [];
  for (const [, e] of trainEls) {
    if (!e.a.rt || hidden.has(lineOfTrip(e.a.i))) continue;
    const dly = currentDelays(e.a.rt, tNow); ds.push(dly[e.pos.dwell ? e.pos.k : e.pos.next]);
  }
  if (!ds.length) { $('s-ontime').textContent = '–'; $('s-avg').textContent = '–'; $('s-late').textContent = '–'; return; }
  const ontime = ds.filter(d => d < 120 && d > -60).length;
  const avg = ds.reduce((a, b) => a + b, 0) / ds.length;
  $('s-ontime').textContent = Math.round(ontime / ds.length * 100) + '%';
  $('s-avg').textContent = Math.abs(avg) < 30 ? '0:00' : fmtDelay(avg);
  $('s-late').textContent = ds.filter(d => d >= 180).length;
}
function renderAttribution() {
  const parts = [t('attr.data') + ': <a href="https://www.metrobilbao.eus/es/open-data/dataset" target="_blank" rel="noopener">Metro Bilbao</a>, <a href="https://data.ctb.eus/dataset/metro-bilbao-online" target="_blank" rel="noopener">CTB</a>',
    t('attr.map') + ': Eustat/GeoEuskadi, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'];
  if (tilesOn) parts.push(CFG.tileAttribution);
  $('attrib').innerHTML = parts.join(' · ');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 5000); }

/* brand: the wordmark swaps to a light version on dark backgrounds */
function setBrand() {
  if (!BRAND) return;
  $('brand-logo').src = isDark() ? BRAND.logoDark : BRAND.logo;
  let icon = document.querySelector('link[rel="icon"]');
  if (icon) icon.href = BRAND.rings;
}

/* ---------- language ---------- */
function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = t('app.title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-attr]').forEach(e => e.dataset.i18nAttr.split(';').forEach(pair => {
    const [attr, key] = pair.split(':'); e.setAttribute(attr, t(key));
  }));
  const box = $('langs');
  box.innerHTML = LANGS.map(l => `<button type="button" lang="${l}" data-lang="${l}" aria-pressed="${l === lang}" title="${esc(I18N[l]['lang.name'])}">${esc(I18N[l]['lang.short'])}</button>`).join('');
}
function setLanguage(l, save = true) {
  if (!I18N[l]) return;
  lang = l;
  if (save) safeLS.set('mb-lang', l);
  applyLanguage();
  if (D) {
    stnEls.forEach((e, i) => e.g.setAttribute('aria-label', t('stn.aria', { name: D.st[i][0] })));
    renderStatus(); renderAttribution(); renderAlertsButton();
    unitSig = ''; panelSig = ''; renderPanel(false); onView();
  }
}
$('langs').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) setLanguage(b.dataset.lang); });
// ?lang=es in the address, else the viewer's last choice, else Basque
setLanguage([qs.get('lang'), safeLS.get('mb-lang'), 'eu'].find(l => l && I18N[l]) || LANGS[0], false);

/* line toggles */
document.querySelectorAll('.linechip').forEach(b => {
  const L = +b.dataset.line;
  b.setAttribute('aria-pressed', !hidden.has(L));
  b.onclick = () => {
    if (hidden.has(L)) hidden.delete(L); else hidden.add(L);
    if (hidden.size === 2) hidden.delete(L === 1 ? 2 : 1);
    document.querySelectorAll('.linechip').forEach(x => x.setAttribute('aria-pressed', !hidden.has(+x.dataset.line)));
    safeLS.set('mb-hidden-lines', JSON.stringify([...hidden]));
    panelSig = ''; onView();
  };
});
$('collapse').onclick = () => {
  const c = $('card').classList.toggle('collapsed');
  $('collapse').setAttribute('aria-expanded', !c); $('collapse').setAttribute('aria-label', c ? t('card.expand') : t('card.collapse'));
};
$('status').onclick = () => select({ type: 'about' });
$('list-btn').onclick = () => select({ type: 'list' });
$('alerts-btn').onclick = () => select({ type: 'alerts' });

/* search */
const q = $('q'), results = $('results'); let resIdx = 0, resList = [];
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function renderResults() {
  const v = fold(q.value.trim());
  if (!v) { results.hidden = true; return; }
  resList = D.st.map((s, i) => ({ i, n: s[0] })).filter(o => fold(o.n).includes(v)).sort((a, b) => fold(a.n).indexOf(v) - fold(b.n).indexOf(v)).slice(0, 8);
  resIdx = 0;
  results.innerHTML = resList.length ? resList.map((o, j) => `<li role="option" data-i="${o.i}" aria-selected="${j === 0}">${[1, 2].filter(l => stationLines[o.i] & l).map(l => `<b class="badge sm l${l}">L${l}</b>`).join('')}${esc(o.n)}</li>`).join('') : `<li aria-disabled="true">${t('search.none')}</li>`;
  results.hidden = false;
}
q.addEventListener('input', renderResults);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); resIdx = clamp(resIdx + (e.key === 'ArrowDown' ? 1 : -1), 0, resList.length - 1); [...results.children].forEach((li, j) => li.setAttribute('aria-selected', j === resIdx)); }
  if (e.key === 'Enter' && resList[resIdx]) { pick(resList[resIdx].i); }
  if (e.key === 'Escape') { q.value = ''; results.hidden = true; }
});
results.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) pick(+li.dataset.i); });
function pick(i) { q.value = ''; results.hidden = true; q.blur(); select({ type: 'stn', id: i }, { fly: true }); }

/* map controls */
$('zi').onclick = () => zoomAt(1.6, W / 2, H / 2);
$('zo').onclick = () => zoomAt(1 / 1.6, W / 2, H / 2);
$('fit').onclick = () => fitNetwork(true);
$('tiles-btn').onclick = () => setTiles(!tilesOn);

/* =====================================================================
 * Pointer & keyboard interaction
 * ===================================================================== */
const ptrs = new Map(); let pinch = null, dragMoved = 0;
svg.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) dragMoved = 0;
  svg.classList.add('drag'); flight = null;
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    dragMoved += Math.abs(dx) + Math.abs(dy);
    view.cx -= dx / view.s; view.cy -= dy / view.s; constrain(); onView();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const r = svg.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    pinch = d; dragMoved = 99;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) svg.classList.remove('drag'); };
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => svg.addEventListener(t, endPtr));
svg.addEventListener('wheel', e => { e.preventDefault(); flight = null; const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
svg.addEventListener('click', () => { if (dragMoved < 6 && selected && W > 760) { /* keep panel on desktop */ } });
svg.addEventListener('dblclick', e => { const r = svg.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.key === 'Escape') select(null);
  const step = 80;
  if (e.key === 'ArrowLeft') { view.cx -= step / view.s; constrain(); onView(); }
  if (e.key === 'ArrowRight') { view.cx += step / view.s; constrain(); onView(); }
  if (e.key === 'ArrowUp' && !e.target.closest('#panel')) { view.cy -= step / view.s; constrain(); onView(); }
  if (e.key === 'ArrowDown' && !e.target.closest('#panel')) { view.cy += step / view.s; constrain(); onView(); }
  if (e.key === '+' || e.key === '=') zoomAt(1.4, W / 2, H / 2);
  if (e.key === '-') zoomAt(1 / 1.4, W / 2, H / 2);
});
addEventListener('resize', () => { computeLimits(); constrain(); onView(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { onView(); setBrand(); });
new MutationObserver(() => { onView(); setBrand(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* =====================================================================
 * Main loop
 * ===================================================================== */
let lastSec = -1, lastActive = 0, lastPanel = 0;
function frame(t) {
  stepFlight(t);
  if (viewDirty) applyView();
  const ms = nowMs();
  if (t - lastActive > 1000) { refreshActive(); lastActive = t; }
  const counts = updateTrains(t);
  const sec = Math.floor(ms / 1000);
  if (sec !== lastSec) {
    lastSec = sec;
    const p = partsAt(ms);
    $('clock').innerHTML = `${p.hour}:${p.minute}<span>:${p.second}</span>`;
    renderStats(counts);
  }
  if (t - lastPanel > 1000) { renderPanel(false); lastPanel = t; }
  else if (selected && selected.type === 'train') positionTimelineMarker();
  requestAnimationFrame(frame);
}

async function start() {
  try {
    [D, BM] = await Promise.all([loadTimetable(), loadBasemap()]);
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', `<div class="empty" style="position:fixed;inset:auto 16px 16px;background:var(--paper);border-radius:12px">${esc(t('err.timetable'))} ${esc(e.message)}</div>`);
    return;
  }
  prepare();
  M = MBCore.createModel(D);
  setBrand();
  drawBasemap();
  computeLimits();
  buildStations();
  const tilesAvailable = !STANDALONE && CFG.tiles && BM;
  $('tiles-btn').hidden = !tilesAvailable;
  if (tilesAvailable) setTiles(safeLS.get('mb-tiles') !== '0'); else renderAttribution();
  fitNetwork(false);
  renderStatus();
  // timetable validity
  const today = ymd(nowMs()).ds;
  if (D.valid && D.valid[1] && today > D.valid[1]) toast(t('toast.expired', { date: fmtDate(D.valid[1]) }));
  if (SIMULATED) toast(t('toast.sim', { time: hhmm(nowMs()) }) + (speed !== 1 ? t('toast.speed', { x: speed }) : ''));
  // deep link: #abando
  const h = location.hash.slice(1);
  if (h) { const i = D.st.findIndex(s => slug(s[0]) === h); if (i >= 0) select({ type: 'stn', id: i }, { fly: true, focus: false }); }
  refreshActive();
  requestAnimationFrame(frame);
  await pollLive();
  refreshActive();
  if (!STANDALONE && RT.state !== 'offline') setInterval(pollLive, CFG.pollMs);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && RT.state !== 'offline') pollLive(); });
}
start();
window.__MB = { get D() { return D; }, get RT() { return RT; }, get active() { return active; }, view, select, nowMs, contexts, delaysFor, trainPosition };
})();
</script>
